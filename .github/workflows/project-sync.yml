name: Blue Ridge Project Sync

on:
  pull_request:
    paths:
      - ".github/project-sync/**"
      - ".github/workflows/project-sync.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Optional exact OWNER/REPOSITORY"
        required: false
        type: string
      pr:
        description: "Optional merged pull request number"
        required: false
        type: number
      write:
        description: "Apply writes (requires the tracked activation flag and secret)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: blue-ridge-project-sync
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Project Sync
        run: |
          python3 -m unittest discover -s .github/project-sync -p 'test_*.py'
          python3 -m py_compile .github/project-sync/project_sync.py .github/project-sync/test_project_sync.py
          python3 -m json.tool .github/project-sync/routes.json >/dev/null
          python3 -c 'import json; assert json.load(open(".github/project-sync/activation.json")) == {"scheduled_writes_enabled": True}'

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.BLUE_RIDGE_PROJECT_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read tracked activation flag
        id: activation
        shell: bash
        run: |
          enabled=false
          if [[ -f .github/project-sync/activation.json ]] && \
            python3 -c 'import json; import sys; sys.exit(not json.load(open(".github/project-sync/activation.json"))["scheduled_writes_enabled"])'; then
            enabled=true
          fi
          echo "scheduled_writes_enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Skip disabled scheduled sync
        if: ${{ github.event_name == 'schedule' && steps.activation.outputs.scheduled_writes_enabled != 'true' }}
        run: echo "Scheduled Project Sync remains disabled by the tracked activation flag."

      - name: Validate authentication
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.activation.outputs.scheduled_writes_enabled == 'true') }}
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "BLUE_RIDGE_PROJECT_SYNC_TOKEN is not configured." >&2
            exit 1
          fi
          gh api user --jq '.login'
          gh api users/owensreo/projectsV2 --jq 'length'
          gh api orgs/Blue-Ridge-Systems-Consulting/projectsV2 --jq 'length'

      - name: Validate write gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.write && steps.activation.outputs.scheduled_writes_enabled != 'true' }}
        shell: bash
        run: |
          echo "Project Sync writes are disabled by the tracked activation flag." >&2
          exit 1

      - name: Sync recent merged pull requests
        if: ${{ github.event_name == 'schedule' && steps.activation.outputs.scheduled_writes_enabled == 'true' }}
        run: python3 .github/project-sync/project_sync.py --recent-hours 2 --write

      - name: Process requested pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository != '' && inputs.pr != 0 }}
        shell: bash
        run: |
          args=(--repository "${{ inputs.repository }}" --pr "${{ inputs.pr }}")
          if [[ "${{ inputs.write }}" == "true" ]]; then
            args+=(--write)
          fi
          python3 .github/project-sync/project_sync.py "${args[@]}"

      - name: Dry-run recent merged pull requests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == '' && inputs.pr == 0 }}
        run: python3 .github/project-sync/project_sync.py --recent-hours 48
